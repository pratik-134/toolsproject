services:
  postgres:
    image: postgres:16-alpine
    container_name: cleartrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleartrix_user
      POSTGRES_PASSWORD: cleartrix_password
      POSTGRES_DB: cleartrix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleartrix_user -d cleartrix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cleartrix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: cleartrix_postgres_data
  redis_data:
    name: cleartrix_redis_data
