services:
  postgres:
    image: postgres:16-alpine
    container_name: resumebuilderlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumebuilderlab_user
      POSTGRES_PASSWORD: resumebuilderlab_password
      POSTGRES_DB: resumebuilderlab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumebuilderlab_user -d resumebuilderlab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resumebuilderlab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: resumebuilderlab_postgres_data
  redis_data:
    name: resumebuilderlab_redis_data
