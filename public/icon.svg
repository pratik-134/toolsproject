<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="qBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Outer Brand Ring Gradient: Blue -> Sky -> Emerald -->
    <linearGradient id="qRingGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>

    <!-- Power Spark & Tail Gradient -->
    <linearGradient id="qTailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="qCoreGlow" cx="48%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#0EA5E9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Canvas Frame -->
  <rect width="512" height="512" rx="116" fill="url(#qBgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.6" />

  <!-- Ambient Radiant Core Glow -->
  <circle cx="240" cy="236" r="150" fill="url(#qCoreGlow)" />

  <!-- The "Q" Monogram Ring Body -->
  <circle
    cx="240"
    cy="236"
    r="126"
    fill="none"
    stroke="url(#qRingGrad)"
    stroke-width="52"
    stroke-linecap="round"
  />

  <!-- High-Energy Generator Diagonal Tail for "Q" -->
  <path
    d="M 292 288 L 396 392"
    stroke="url(#qTailGrad)"
    stroke-width="52"
    stroke-linecap="round"
  />

  <!-- Generator Power Node (Center Core Dynamic Accent) -->
  <circle cx="240" cy="236" r="28" fill="#0EA5E9" opacity="0.9" />
  <circle cx="240" cy="236" r="14" fill="#E0F2FE" />
</svg>
